[package]
name = "hydrogen-audio-engine"
version = "0.1.0"
edition = "2021"
description = "Experimental Hydrogen Music DJ audio engine with EQ and dual-deck mixing"

[[bin]]
name = "hydrogen-audio-engine"
path = "src/main.rs"

[dependencies]
# Audio I/O
cpal = "0.15"

# Audio decoding (FLAC, MP3, WAV, OGG)
symphonia = { version = "0.5", features = ["all"] }

# IIR filters for EQ
biquad = "0.4"

# JSON serialization for RPC
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
